services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Прокидываем папку с базой данных и картинками, чтобы они не удалялись при перезапуске
      - ./data:/app/data
      # Прокидываем frontend, чтобы можно было редактировать HTML без пересборки контейнера
      - ./frontend:/app/frontend
      # Прокидываем app и server.py для удобной разработки
      - ./app:/app/app
      # ml тоже прокидываем — иначе после git pull в контейнере остаётся старый парсер Qwen
      - ./ml:/app/ml
      - ./server.py:/app/server.py
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      # Модели распознавания PaddleOCR (~100 МБ): скачиваются один раз и переживают --build и down/up
      - paddlex_models:/root/.paddlex
    environment:
      # Ключ подписи JWT берётся из файла .env рядом с docker-compose.yml (см. .env.example)
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      # X-Forwarded-For учитывается только за своим прокси (1); иначе лимит запросов можно обойти
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - ORPHAN_CLEANUP_HOURS=${ORPHAN_CLEANUP_HOURS:-6}
      # База данных (по умолчанию SQLite; для Postgres: postgresql://checkai:checkai_secret@db:5432/checkai)
      - DATABASE_URL=${DATABASE_URL:-}
      # Адрес Ollama: по умолчанию контейнер ollama (--profile full).
      # Для Ollama, установленной на компьютере: DOCKER_OLLAMA_HOST=http://host.docker.internal:11434 в .env
      - OLLAMA_HOST=${DOCKER_OLLAMA_HOST:-http://ollama:11434}
      # Категоризация (ml/app/categorize.py) читает свой адрес — иначе в контейнере это localhost
      - OLLAMA_URL=${DOCKER_OLLAMA_HOST:-http://ollama:11434}/api/generate
      # Режим работы: auto (Ollama при наличии, fallback на быстрый regex-парсер)
      - USE_AI_PARSER=${USE_AI_PARSER:-auto}
      # Отключаем багнутые фичи PaddlePaddle 3.0 на Intel/AMD процессорах
      - FLAGS_enable_pir_api=0
      - FLAGS_use_onednn=0
      - FLAGS_enable_pir_in_executor=0
      - FLAGS_pir_apply_inplace_pass=0
      # Не проверять связь с серверами моделей при каждом старте: модели уже лежат в paddlex_models
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      # Загружать модель распознавания при старте, а не при первом чеке (0 — выключить)
      - OCR_WARMUP=${OCR_WARMUP:-1}
      # Уровень логов приложения; на INFO видно время этапов распознавания
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_started
        required: false
      db:
        condition: service_started
        required: false

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkai}
      POSTGRES_USER: ${POSTGRES_USER:-checkai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkai_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - postgres
      - full

  ollama:
    image: ollama/ollama:latest
    # Сервис ollama запускается ТОЛЬКО при указании профиля:
    # docker compose --profile full up (или --profile ml)
    profiles:
      - full
      - ml
    ports:
      - "11434:11434"
    volumes:
      # Сохраняем скачанные модели нейросетей
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
  postgres_data:
  paddlex_models:
