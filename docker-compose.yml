version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Прокидываем папку с базой данных и картинками, чтобы они не удалялись при перезапуске
      - ./data:/app/data
      # Прокидываем frontend, чтобы можно было редактировать HTML без пересборки контейнера
      - ./frontend:/app/frontend
    environment:
      # Указываем Python-библиотеке ollama адрес соседнего контейнера
      - OLLAMA_HOST=http://ollama:11434
      # Отключаем багнутые фичи PaddlePaddle 3.0 на Intel/AMD процессорах
      - FLAGS_enable_pir_api=0
      - FLAGS_use_onednn=0
      - FLAGS_enable_pir_in_executor=0
      - FLAGS_pir_apply_inplace_pass=0
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Сохраняем скачанные модели нейросетей, чтобы не скачивать каждый раз заново
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
