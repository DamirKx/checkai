# Конфигурация Alembic. Адрес базы берётся из app/config.py (переменная DATABASE_URL),
# поэтому sqlalchemy.url здесь не задаётся.
#
# Сервер применяет миграции сам при старте. Вручную:
#   alembic upgrade head                          — применить все миграции
#   alembic revision --autogenerate -m "описание" — создать новую по изменениям в app/models.py

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
